name: Rename preview to index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename preview-index.html to index.html
        run: |
          git config user.name "hanglex9x-cmyk"
          git config user.email "hanglex9x-cmyk@users.noreply.github.com"
          if [ ! -f preview-index.html ]; then
            echo "No preview-index.html; nothing to do."
            exit 0
          fi
          rm -f index.html
          git rm --cached index.html 2>/dev/null || true
          git mv preview-index.html index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Rename preview-index.html to index.html (badge overlap fix)"
          git push
